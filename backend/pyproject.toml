[project]
name = "spliteasy-backend"
version = "0.1.0"
description = "FastAPI backend for SplitEasy"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
